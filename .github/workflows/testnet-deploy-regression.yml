name: Testnet Deploy Regression

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  deploy-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.84.0
        with:
          targets: wasm32v1-none

      # Same CDN 503 flake that broke ci.yml — see issue #119.
      - name: Restore Stellar CLI from cache
        id: stellar-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/stellar
          key: stellar-cli-27.0.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install Stellar CLI
        if: steps.stellar-cli-cache.outputs.cache-hit != 'true'
        run: bash scripts/install-stellar-cli.sh 27.0.0

      # The install action puts ~/.local/bin on PATH itself; on a cache hit it is
      # skipped, so add the directory here too.
      - name: Add Stellar CLI to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Also guards the cache: a restored binary of the wrong version fails here
      # rather than silently running the regression against something else.
      - name: Verify Stellar CLI version
        run: |
          version="$(stellar --version)"
          echo "$version"
          [[ "$version" == *"27.0.0"* ]]

      - name: Restore Stellar CLI config
        env:
          CAATINGA_CI_STELLAR_CONFIG_B64: ${{ secrets.CAATINGA_CI_STELLAR_CONFIG_B64 }}
          CAATINGA_CI_IDENTITY_ALIAS: ${{ secrets.CAATINGA_CI_IDENTITY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$CAATINGA_CI_STELLAR_CONFIG_B64"
          test -n "$CAATINGA_CI_IDENTITY_ALIAS"
          bash scripts/restore-stellar-ci-config.sh
          stellar keys public-key "$CAATINGA_CI_IDENTITY_ALIAS" >/dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Deploy regression on react-vite-counter template
        env:
          CAATINGA_CI_IDENTITY_ALIAS: ${{ secrets.CAATINGA_CI_IDENTITY_ALIAS }}
        run: |
          set -euo pipefail
          WORKDIR="deploy-regression-counter"
          rm -rf "$WORKDIR"
          cp -R packages/templates/react-vite-counter "$WORKDIR"
          cd "$WORKDIR"
          pnpm install --ignore-workspace
          pnpm exec ctg build counter
          pnpm exec ctg deploy counter --network testnet --source "$CAATINGA_CI_IDENTITY_ALIAS" --if-changed
          pnpm exec ctg generate counter --network testnet --strict-network
          pnpm exec ctg doctor --network testnet --strict-bindings

      - name: Remove Stellar CLI config
        if: always()
        run: |
          rm -f "$HOME/.config/stellar/config.toml"
          rm -rf "$HOME/.config/soroban/identity"
