name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v27.0.0

      - name: Verify Stellar CLI version
        run: stellar --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Version alignment
        run: pnpm check:versions

      - name: Typecheck
        run: pnpm typecheck

      - name: Docs check
        run: pnpm docs:check

      - name: Docs build
        run: pnpm docs:build

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  stellar-cli-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stellar-version: ["23.3.0", "25.2.0", "27.0.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Stellar CLI ${{ matrix.stellar-version }}
        uses: stellar/stellar-cli@v27.0.0
        with:
          version: ${{ matrix.stellar-version }}

      - name: Verify Stellar CLI version
        run: stellar --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fixture matrix tests
        run: pnpm --filter @caatinga/core test -- stellar-cli-fixture-matrix

      - name: Live capability probe
        run: pnpm --filter @caatinga/core test -- probe-stellar-cli-features
