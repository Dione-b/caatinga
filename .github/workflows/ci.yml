name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # Runs before any dependency is installed: blocks obfuscated code, hidden
      # Unicode, install hooks and non-registry dependencies in the PR's files.
      - name: Supply-chain guard
        run: node scripts/check-no-obfuscation.mjs

      # The install action downloads a tarball from the GitHub releases CDN, which
      # intermittently answers 503 and fails the job before any test runs. Caching the
      # binary keeps the network off the common path. See issue #119.
      - name: Restore Stellar CLI from cache
        id: stellar-cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/stellar
          key: stellar-cli-28.0.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install Stellar CLI
        if: steps.stellar-cli-cache.outputs.cache-hit != 'true'
        run: bash scripts/install-stellar-cli.sh 28.0.0

      # The install action puts ~/.local/bin on PATH itself; on a cache hit it is
      # skipped, so add the directory here too.
      - name: Add Stellar CLI to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Also guards the cache: a restored binary of the wrong version fails here
      # rather than silently testing against something else.
      - name: Verify Stellar CLI version
        run: |
          version="$(stellar --version)"
          echo "$version"
          [[ "$version" == *"28.0.0"* ]]

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Version alignment
        run: pnpm check:versions

      - name: Typecheck
        run: pnpm typecheck

      - name: Docs check
        run: pnpm docs:check

      - name: Template imports
        run: pnpm check:template-imports

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # ZK checks that need real toolchains: the verifier scaffold under `cargo test`
  # (#299) and snarkjs-backed ceremony verification (#300).
  zk-verifier-cargo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@dd87c1884d4b74c592b9ad3151acd86a8a80c6f2 # 1.91.1

      - name: Restore cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/zk-verifier-target
          key: zk-verifier-cargo-${{ runner.os }}-${{ hashFiles('packages/core/scaffolds/zk-verifier/Cargo.lock') }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Embedded VK equivalence
        env:
          CAATINGA_CARGO_TESTS: "1"
          CARGO_TARGET_DIR: ${{ runner.temp }}/zk-verifier-target
        run: pnpm --filter @caatinga/zk exec vitest run src/build/embedded-vk-equivalence.test.ts

      # Real snarkjs: a power-8 BLS12-381 ceremony, imported and checked by
      # `ctg zk verify-ceremony`'s logic, including tampered-key cases (#300).
      - name: Ceremony verification
        env:
          CAATINGA_ZK_TOOLS_TESTS: "1"
        run: pnpm --filter @caatinga/zk exec vitest run src/ceremony/verify-ceremony.test.ts

  stellar-cli-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stellar-version: ["23.3.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # See the comment on the cache step in the `ci` job above (issue #119).
      - name: Restore Stellar CLI from cache
        id: stellar-cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/stellar
          key: stellar-cli-${{ matrix.stellar-version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Stellar CLI ${{ matrix.stellar-version }}
        if: steps.stellar-cli-cache.outputs.cache-hit != 'true'
        run: bash scripts/install-stellar-cli.sh ${{ matrix.stellar-version }}

      - name: Add Stellar CLI to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Also guards the cache: a restored binary of the wrong version fails here
      # rather than silently testing against something else.
      - name: Verify Stellar CLI version
        run: |
          version="$(stellar --version)"
          echo "$version"
          [[ "$version" == *"${{ matrix.stellar-version }}"* ]]

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fixture matrix tests
        run: pnpm --filter @caatinga/core test -- stellar-cli-fixture-matrix

      - name: Live capability probe
        run: pnpm --filter @caatinga/core test -- probe-stellar-cli-features
