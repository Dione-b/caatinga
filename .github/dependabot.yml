version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major bumps (eslint, vite, plugin-react, ...) need a planned migration
    # and are upgraded by hand; Dependabot only proposes minor/patch.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Contracted public ranges (see packages/core/src/stellar-sdk/version.ts
      # and src/release/package-manifest.test.ts); bumped deliberately together
      # with STELLAR_SDK_LAST_TESTED_VERSION and the templates.
      - dependency-name: "@stellar/stellar-sdk"
      - dependency-name: "@creit.tech/stellar-wallets-kit"
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
