[package]
name = "verifier"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "27.0.6"

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }
ark-bls12-381 = "0.4.0"
ark-serialize = "0.4.2"
ark-ff = "0.4.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
